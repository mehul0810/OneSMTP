name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - develop
      - 'release/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  php-quality:
    name: PHP ${{ matrix.php }} checks
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          coverage: none

      - name: Validate composer.json
        run: composer validate --strict

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: ${{ runner.os }}-php-${{ matrix.php }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-${{ matrix.php }}-composer-

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Lint changed PHP files
        run: composer lint

      - name: Run PHPUnit suite
        run: composer test

      - name: Run PHPStan
        run: ./vendor/bin/phpstan analyse --configuration=phpstan.neon --no-progress --memory-limit=512M

      - name: Composer audit
        run: composer audit --locked --no-interaction

  node-build:
    name: Node build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'

      - name: Install npm dependencies
        run: npm ci

      - name: Lint JavaScript
        run: npm run lint:js

      - name: Build assets
        run: npm run build

      - name: npm audit (high+critical)
        run: npm audit --omit=dev --audit-level=high

  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: ['actions']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Analyze
        uses: github/codeql-action/analyze@v3

  package-verification:
    name: Package verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm

      - name: Install admin build dependencies
        run: npm ci

      - name: Build admin assets
        run: npm run build

      - name: Build package artifact
        run: bash scripts/ci/build-package.sh dist

      - name: Verify package checksum file
        run: |
          set -euo pipefail
          cd dist
          test -s onesmtp.zip
          test -s onesmtp.zip.sha256
          shasum -a 256 -c onesmtp.zip.sha256

      - name: Upload verification artifact
        uses: actions/upload-artifact@v4
        with:
          name: onesmtp-package-verification
          path: |
            dist/onesmtp.zip
            dist/onesmtp.zip.sha256
